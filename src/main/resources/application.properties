# MySQL connection (override with environment variables when hosting)
# createDatabaseIfNotExist=true creates the "flowbiz" database automatically (user needs permission)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowbiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables "users" and "enquiries" are created/updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Hosting platforms provide PORT automatically
server.port=${PORT:8080}

server.servlet.session.timeout=2h
