<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Flowbiz Exports Pvt. Ltd.</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-hero">
    <div class="container"><h1>Contact Us</h1><p>Send us your enquiry and we will get back to you.</p></div>
  </section>

  <section class="block">
    <div class="container two-col">
      <div>
        <h2 class="title">Get in Touch</h2>
        <ul class="info-list" style="margin-top:16px">
          <li><strong>Company Address</strong>Flowbiz Exports Pvt. Ltd.<br>[Your street address], [City], [State] - [PIN], India</li>
          <li><strong>Email</strong><a href="mailto:info@flowbizexports.com">info@flowbizexports.com</a></li>
          <li><strong>Contact Number</strong><a href="tel:+910000000000">+91 00000 00000</a></li>
        </ul>
        <p style="margin:18px 0 8px"><strong>Location</strong></p>
        <!-- Replace the src with your Google Maps "Embed a map" link for your exact address -->
        <iframe class="map" loading="lazy" title="Company location"
          src="https://www.google.com/maps?q=Mumbai,India&output=embed"></iframe>
        <p style="margin-top:8px"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Mumbai,India">Open in Google Maps &rarr;</a></p>
      </div>

      <div class="form-wrap" style="margin:0">
        <h2>Enquiry Form</h2>
        <form data-api="/api/enquiries">
          <label for="name">Name *</label>
          <input id="name" name="name" required>
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required>
          <label for="phone">Phone</label>
          <input id="phone" name="phone">
          <label for="company">Company</label>
          <input id="company" name="company">
          <label for="product">Product of interest</label>
          <select id="product" name="product">
            <option value="">-- Select --</option>
            <option>Ball Valves</option>
            <option>Gate Valves</option>
            <option>Butterfly Valves</option>
            <option>Globe Valves</option>
            <option>Check Valves</option>
            <option>Strainers</option>
          </select>
          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="4" required></textarea>
          <button class="btn" type="submit">Send Enquiry</button>
          <div class="msg"></div>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
